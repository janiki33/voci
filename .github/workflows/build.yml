name: Voci bauen

# Baut bei jedem Push auf main (und auf Knopfdruck) die Windows- und
# macOS-Fassung und hängt sie an das Release "latest".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Vokabeln und Icons erzeugen
        shell: bash
        run: |
          pip install --upgrade pillow
          python build/make_icons.py
          python build/make_app.py

      # Nuitka statt PyInstaller: PyInstaller hängt die Anwendung an einen
      # vorkompilierten Bootloader, der in jeder damit gebauten EXE weltweit
      # identisch ist - auch in Schadsoftware. Genau darauf schlagen die
      # ML-Heuristiken der Virenscanner an (Trojan:Win32/Sabsik.FLA!ml).
      # Nuitka übersetzt den Python-Code stattdessen nach C und kompiliert
      # ein gewöhnliches Programm ohne diesen gemeinsamen Nenner.
      - name: Nuitka installieren
        shell: bash
        run: pip install --upgrade nuitka

      - name: EXE bauen
        shell: bash
        run: |
          cp Voci.pyw voci_main.py
          gemeinsam=(
            --enable-plugin=tk-inter
            --assume-yes-for-downloads
            --jobs=4
            --windows-console-mode=disable
            --windows-icon-from-ico=assets/voci.ico
            "--company-name=Janosch Salzgeber"
            "--product-name=Voci"
            "--file-version=1.0.0.0"
            "--product-version=1.0.0.0"
            "--file-description=Voci - Vokabeltrainer Französisch/Deutsch"
            "--copyright=© 2026 Janosch Salzgeber"
          )
          python -m nuitka --mode=onefile "${gemeinsam[@]}" \
            --output-dir=nuitka-einzeldatei --output-filename=Voci.exe voci_main.py
          python -m nuitka --mode=standalone "${gemeinsam[@]}" \
            --output-dir=nuitka-ordner --output-filename=Voci.exe voci_main.py

      - name: Dateien sammeln
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item nuitka-einzeldatei/Voci.exe out/Voci.exe
          Copy-Item Voci.pyw out/Voci.pyw
          Rename-Item nuitka-ordner/voci_main.dist Voci
          Compress-Archive -Path nuitka-ordner/Voci -DestinationPath out/Voci-Windows-Ordner.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Vokabeln und Icons erzeugen
        run: |
          pip install --upgrade pillow
          python build/make_icons.py
          python build/make_app.py

      - name: PyInstaller installieren
        run: pip install --upgrade pyinstaller

      - name: App-Bundle bauen
        run: |
          cp Voci.pyw voci_main.py
          pyinstaller --windowed --noupx --name Voci \
            --icon assets/voci.icns --osx-bundle-identifier ch.janiki33.voci \
            --workpath pyi-build voci_main.py
          PLIST=dist/Voci.app/Contents/Info.plist
          for eintrag in \
            "NSHumanReadableCopyright:© 2026 Janosch Salzgeber" \
            "CFBundleGetInfoString:Voci - Vokabeltrainer, Janosch Salzgeber"; do
            schluessel="${eintrag%%:*}"; wert="${eintrag#*:}"
            plutil -insert "$schluessel" -string "$wert" "$PLIST" 2>/dev/null \
              || plutil -replace "$schluessel" -string "$wert" "$PLIST"
          done
          plutil -lint "$PLIST"
          mkdir -p out
          ditto -c -k --keepParent dist/Voci.app out/Voci-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/

  release:
    needs: [windows, macos]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Release "latest" aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ls -la out
          gh release delete latest --repo "$REPO" --yes --cleanup-tag || true
          gh release create latest out/* --repo "$REPO" \
            --target "$GITHUB_SHA" \
            --title "Voci - neuste Version" \
            --notes-file - <<'NOTES'
          Automatisch gebaut aus dem aktuellen Stand von `main`.

          | Datei | Für wen |
          |---|---|
          | `Voci.exe` | Windows, eine einzige Datei. Herunterladen, doppelklicken. |
          | `Voci-Windows-Ordner.zip` | Windows-Alternative, falls ein Virenscanner die EXE anmeckert. Entpacken und `Voci.exe` im Ordner starten. |
          | `Voci-macOS.zip` | macOS (Apple Silicon). Entpacken, `Voci.app` starten. |
          | `Voci.pyw` | Alle Systeme mit installiertem Python, ganz ohne Warnungen. |

          ### Windows warnt beim ersten Start

          *Der Computer wurde durch Windows geschützt* erscheint bei **jedem**
          Programm ohne gekauftes Signaturzertifikat - es ist keine Virenmeldung.

          **Weitere Informationen** anklicken, dann **Trotzdem ausführen**.

          Wer die Warnung gar nicht erst sehen will: Rechtsklick auf die
          heruntergeladene `Voci.exe` → **Eigenschaften** → unten bei *Sicherheit*
          den Haken bei **Zulassen** setzen -> **OK**.

          ### macOS warnt beim ersten Start

          *"Voci" kann nicht geöffnet werden, da Apple es nicht auf Schadsoftware
          überprüfen kann.* Auch das ist keine Virenmeldung, sondern die fehlende
          Apple-Signatur (99 USD pro Jahr).

          - **macOS 15 (Sequoia) und neuer:** Doppelklick, Meldung wegklicken, dann
            **Systemeinstellungen → Datenschutz & Sicherheit** öffnen, ganz nach
            unten scrollen und dort **Dennoch öffnen** wählen.
          - **macOS 14 und älter:** Rechtsklick (oder Ctrl-Klick) auf `Voci.app`
            → **Öffnen** → im Dialog nochmals **Öffnen**.
          - **Per Terminal:** `xattr -dr com.apple.quarantine /Pfad/zu/Voci.app`

          Beides ist einmal pro heruntergeladener Datei nötig.
          NOTES
