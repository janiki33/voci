name: Voci bauen

# Baut bei jedem Push auf main (und auf Knopfdruck) die Windows- und
# macOS-Fassung und hängt sie an das Release "latest".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Der Tag wird einmal bestimmt und an alle Jobs weitergereicht. Sonst könnte
  # er zwischen den Jobs über Mitternacht springen, und die eingebaute Version
  # wiche vom Release-Tag ab - der Updater würde dann dauerhaft ein Update
  # melden, das schon installiert ist.
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bestimmen.outputs.tag }}
    steps:
      - id: bestimmen
        run: echo "tag=v$(date -u +%Y.%m.%d)-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Vokabeln und Icons erzeugen
        shell: bash
        env:
          VOCI_VERSION: ${{ needs.version.outputs.tag }}
        run: |
          pip install --upgrade pillow PySide6
          python build/make_icons.py
          python build/make_app.py

      # Nuitka statt PyInstaller: PyInstaller hängt die Anwendung an einen
      # vorkompilierten Bootloader, der in jeder damit gebauten EXE weltweit
      # identisch ist - auch in Schadsoftware. Genau darauf schlagen die
      # ML-Heuristiken der Virenscanner an (Trojan:Win32/Sabsik.FLA!ml).
      # Nuitka übersetzt den Python-Code stattdessen nach C und kompiliert
      # ein gewöhnliches Programm ohne diesen gemeinsamen Nenner.
      - name: Nuitka installieren
        shell: bash
        run: pip install --upgrade nuitka

      - name: EXE bauen
        shell: bash
        run: |
          cp Voci.pyw voci_main.py
          gemeinsam=(
            --enable-plugin=pyside6
            --assume-yes-for-downloads
            --jobs=4
            --windows-console-mode=disable
            --windows-icon-from-ico=assets/voci.ico
            "--company-name=Janosch Salzgeber"
            "--product-name=Voci"
            "--file-version=1.0.0.0"
            "--product-version=1.0.0.0"
            "--file-description=Voci - Vokabeltrainer Französisch/Deutsch"
            "--copyright=© 2026 Janosch Salzgeber"
          )
          python -m nuitka --mode=onefile --onefile-no-compression "${gemeinsam[@]}" \
            --output-dir=nuitka-einzeldatei --output-filename=Voci.exe voci_main.py
          python -m nuitka --mode=standalone "${gemeinsam[@]}" \
            --output-dir=nuitka-ordner --output-filename=Voci.exe voci_main.py

      - name: Dateien sammeln
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item nuitka-einzeldatei/Voci.exe out/Voci.exe
          Copy-Item Voci.pyw out/Voci.pyw
          Rename-Item nuitka-ordner/voci_main.dist Voci
          Compress-Archive -Path nuitka-ordner/Voci -DestinationPath out/Voci-Windows-Ordner.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/

  macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Vokabeln und Icons erzeugen
        env:
          VOCI_VERSION: ${{ needs.version.outputs.tag }}
        run: |
          pip install --upgrade pillow PySide6
          python build/make_icons.py
          python build/make_app.py

      - name: PyInstaller installieren
        run: pip install --upgrade pyinstaller

      - name: App-Bundle bauen
        run: |
          cp Voci.pyw voci_main.py
          pyinstaller --windowed --noupx --name Voci \
            --icon assets/voci.icns --osx-bundle-identifier ch.janiki33.voci \
            --collect-submodules PySide6 --workpath pyi-build voci_main.py
          PLIST=dist/Voci.app/Contents/Info.plist
          for eintrag in \
            "NSHumanReadableCopyright:© 2026 Janosch Salzgeber" \
            "CFBundleGetInfoString:Voci - Vokabeltrainer, Janosch Salzgeber"; do
            schluessel="${eintrag%%:*}"; wert="${eintrag#*:}"
            plutil -insert "$schluessel" -string "$wert" "$PLIST" 2>/dev/null \
              || plutil -replace "$schluessel" -string "$wert" "$PLIST"
          done
          plutil -lint "$PLIST"
          # Nach den Aenderungen neu ad-hoc signieren, sonst ist die Signatur
          # des Bundles kaputt und macOS verweigert den Start ganz.
          codesign --force --deep --sign - dist/Voci.app
          codesign --verify --deep dist/Voci.app && echo "Signatur in Ordnung"
          mkdir -p out
          ditto -c -k --keepParent dist/Voci.app out/Voci-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/

  release:
    needs: [version, windows, macos]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      # Jeder Build bekommt einen eigenen Tag. GitHub veroeffentlicht Releases
      # unveraenderlich: Ein einmal benutzter Tag-Name laesst sich nie wieder
      # verwenden. Frueher wurde hier "latest" geloescht und neu angelegt - das
      # Loeschen klappte, das Neuanlegen wurde abgelehnt, und das Repo stand
      # ganz ohne Release da. Der Dauerlink ist /releases/latest, den GitHub
      # selbst auf das neuste Release zeigen laesst.
      - name: Release veroeffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ls -la out
          TAG="${{ needs.version.outputs.tag }}"
          echo "Tag: $TAG"
          gh release create "$TAG" out/* --repo "$REPO" \
            --target "$GITHUB_SHA" --latest \
            --title "Voci - Stand $(date -u +%d.%m.%Y)" \
            --notes-file - <<'NOTES'
          Automatisch gebaut aus dem aktuellen Stand von `main`.

          | Datei | Für wen |
          |---|---|
          | **`Voci-Windows-Ordner.zip`** | **Für Windows die empfohlene Fassung.** Entpacken, dann `Voci.exe` im Ordner starten (am besten eine Verknüpfung auf den Desktop legen). |
          | `Voci.exe` | Windows als eine einzige Datei – bequemer, wird aber von Virenscannern gerne fälschlich gemeldet. Wenn das passiert: die Ordner-Fassung oben nehmen. |
          | `Voci-macOS.zip` | macOS (Apple Silicon). Entpacken, `Voci.app` starten. |
          | `Voci.pyw` | Alle Systeme mit installiertem Python, ganz ohne Warnungen. |

          ### Windows warnt beim ersten Start

          *Der Computer wurde durch Windows geschützt* erscheint bei **jedem**
          Programm ohne gekauftes Signaturzertifikat - es ist keine Virenmeldung.

          **Weitere Informationen** anklicken, dann **Trotzdem ausführen**.

          Wer die Warnung gar nicht erst sehen will: Rechtsklick auf die
          heruntergeladene `Voci.exe` → **Eigenschaften** → unten bei *Sicherheit*
          den Haken bei **Zulassen** setzen -> **OK**.

          ### macOS warnt beim ersten Start

          *"Voci" kann nicht geöffnet werden, da Apple es nicht auf Schadsoftware
          überprüfen kann.* Auch das ist keine Virenmeldung, sondern die fehlende
          Apple-Signatur (99 USD pro Jahr).

          - **macOS 15 (Sequoia) und neuer:** Doppelklick, Meldung wegklicken, dann
            **Systemeinstellungen → Datenschutz & Sicherheit** öffnen, ganz nach
            unten scrollen und dort **Dennoch öffnen** wählen.
          - **macOS 14 und älter:** Rechtsklick (oder Ctrl-Klick) auf `Voci.app`
            → **Öffnen** → im Dialog nochmals **Öffnen**.
          - **Per Terminal:** `xattr -dr com.apple.quarantine /Pfad/zu/Voci.app`

          Beides ist einmal pro heruntergeladener Datei nötig.

          ### Virenscanner meldet eine Bedrohung

          Meldet Defender etwas wie `Trojan:Win32/Wacatac.B!ml` oder
          `Sabsik.FLA!ml`, ist das ein Fehlalarm: Das `!ml` steht für eine
          Verdachtseinstufung durch ein Lernmodell, nicht für eine erkannte
          Signatur. Ausgelöst wird sie davon, dass eine Einzeldatei sich beim
          Start selbst entpackt – ein Verhalten, das auch Schadsoftware zeigt.

          **Dann nimm `Voci-Windows-Ordner.zip`.** Die Fassung entpackt sich
          nicht selbst und ist genau dafür da.

          Wer helfen will, kann den Fehlalarm bei Microsoft melden:
          [Datei zur Analyse einreichen](https://www.microsoft.com/en-us/wdsi/filesubmission).
          Das wird meist innert weniger Tage korrigiert und gilt dann für alle.
          NOTES

          # Aeltere Releases aufraeumen, damit die Seite uebersichtlich bleibt.
          # Schlaegt das fehl, ist das kein Grund, den Build rot zu faerben.
          gh release list --repo "$REPO" --limit 100 --json tagName \
            --jq '.[].tagName' | tail -n +4 | while read -r alt; do
              echo "loesche altes Release $alt"
              gh release delete "$alt" --repo "$REPO" --yes --cleanup-tag || true
            done
